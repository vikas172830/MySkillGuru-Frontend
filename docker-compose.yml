services:
  myskillguru-frontend:
    build:
      context: .
      args:
        API_URL: ${API_URL}
    container_name: myskillguru-frontend
    ports:
      - "3001:3001"
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - lms-shared

networks:
  lms-shared:
    external: true